AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SaansSafe backend: forecast/model AQI API for schools.
  HTTP API -> Lambda (Python 3.13) -> DynamoDB cache. Data: Open-Meteo (CAMS model).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: CORS origins allowed to call the API (add the CloudFront site URL at M5).
  CacheFreshMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1440
    Description: Serve cached forecast data without refetching while younger than this.
  CacheMaxStaleHours:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 24
    Description: Max age of cached data served (marked stale) when Open-Meteo is transiently down.
  OpenMeteoTimeoutSeconds:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 15
    Description: HTTP timeout for Open-Meteo calls (must stay well below the Lambda timeout).
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  AqiCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete # cache only; safe to lose
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /health and GET /aqi (forecast/model AQI, CPCB method)
      CodeUri: src/
      Handler: saanssafe.api.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 20
      Environment:
        Variables:
          AQI_CACHE_TABLE: !Ref AqiCacheTable
          CACHE_FRESH_MINUTES: !Ref CacheFreshMinutes
          CACHE_MAX_STALE_HOURS: !Ref CacheMaxStaleHours
          OPEN_METEO_TIMEOUT_S: !Ref OpenMeteoTimeoutSeconds
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt AqiCacheTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        Aqi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /aqi
            Method: GET
        Forecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /forecast
            Method: GET

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API ($default stage)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  HealthUrl:
    Description: Health check
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/health
  AqiExampleUrl:
    Description: Example AQI request (central Delhi)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/aqi?lat=28.6139&lon=77.2090
  CacheTableName:
    Description: DynamoDB cache table
    Value: !Ref AqiCacheTable
  ApiFunctionName:
    Description: Lambda function (for logs)
    Value: !Ref ApiFunction
