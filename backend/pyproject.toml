[project]
name = "saanssafe-backend"
version = "0.1.0"
description = "SaansSafe backend: CPCB Indian AQI engine and AWS Lambda API"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
